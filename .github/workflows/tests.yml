name: Logic tests
on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Commit SHA from the selected branch (empty = branch HEAD)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source_commit:
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: logic-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash

jobs:
  logic:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Validate requested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ -n "$SOURCE_COMMIT" && ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Use a full 40-character commit SHA, or leave the field empty.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify source belongs to selected revision
        env:
          SELECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD "$SELECTED_REVISION"
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify native callback inventory
        run: python3 scripts/validation/audit-native-callbacks.py --check
      - name: Consolidated logic regressions with sanitizers
        env:
          # Host IOKit models do not emulate framework lifetime reclamation.
          ASAN_OPTIONS: detect_leaks=0
        run: python3 tests/run-development-tests.py --cxx 'clang++ -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Independent P-256 vectors with sanitizers
        run: make sae-p256-userland-check
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logic-test-results
          path: build/development-tests/
          retention-days: 7
