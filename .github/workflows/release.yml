name: Publish Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    uses: ./.github/workflows/build.yml
  publish:
    needs: [tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both validated configurations
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Ath10kMac-*
          merge-multiple: true
          path: dist
      - name: Verify packages and checksums
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for configuration in Release Debug; do
            archive="Ath10kMac-${RELEASE_TAG#v}-${configuration}-x86_64.zip"
            test -f "$archive"
            sha256sum --check --strict "$archive.sha256"
          done
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --repo "$GH_REPO" --verify-tag --title "Ath10kMac ${RELEASE_TAG#v}" \
            --generate-notes "${options[@]}"
