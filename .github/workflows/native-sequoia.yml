name: Experimental Sequoia native adapter
on:
  push:
    branches: [native-sequoia-development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Verify native callback audit matches source
        run: python3 scripts/audit-native-callbacks.py --check
      - name: Build native kext and validate imports
        run: make NATIVE=1 kext -j2
      - name: Portable native protocol regressions
        run: python3 tests/run-development-tests.py
      - name: Host regressions with address and undefined-behavior sanitizers
        env:
          # IOKit host models do not emulate framework lifetime reclamation.
          # This disables leak accounting only, not invalid-access detection.
          ASAN_OPTIONS: detect_leaks=0
        run: python3 tests/run-development-tests.py --cxx 'clang++ -fsanitize=address,undefined -fno-omit-frame-pointer'
